<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de ventas</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f5fbf"><meta name="apple-mobile-web-app-title" content="V-Tech"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7684;--bd:#dde1e7;--pr:#1f5fbf;--ok:#1a7f4b;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b2129;--tx:#e8ecf1;--mu:#9aa5b1;--bd:#2c343e;--pr:#5b9bff;--ok:#4cc38a;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b2129;--tx:#e8ecf1;--mu:#9aa5b1;--bd:#2c343e;--pr:#5b9bff;--ok:#4cc38a;--bad:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#name{font-weight:700;font-size:17px;cursor:pointer;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;cursor:pointer}
button.on,button.pr{background:var(--pr);border-color:var(--pr);color:#fff}
button.x{color:var(--bad)}
main{padding:14px;max-width:1000px;margin:0 auto}
.bar{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;justify-content:flex-end}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-size:12px;text-transform:uppercase}
.r{text-align:right}.mu{color:var(--mu)}.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}
td.a button{margin-right:4px;padding:3px 7px;font-size:12px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px;max-width:100%}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:9}
.box{background:var(--card);border-radius:10px;padding:16px;width:100%;max-width:720px}
.box h3{margin:0 0 12px}
.cards{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cards div{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 14px}
.cards b{display:block;font-size:18px}
@media screen and (max-width:700px){
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 10px}
#name{font-size:15px}header>button,#fs{font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex-wrap:nowrap;overflow-x:auto;gap:6px}
nav button{flex:0 0 auto;padding:10px 12px}
main{padding:10px 10px 96px}
#main .wrap{border:0;background:none;overflow:visible}
#main table,#main tbody{display:block}
#main tr.hd{display:none}
#main tr{display:block;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:10px}
#main td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 0;white-space:normal;text-align:right}
#main td::before{content:attr(data-l);color:var(--mu);font-size:12px;text-align:left;flex:0 0 auto}
#main td.a{flex-wrap:wrap;justify-content:flex-start;padding-top:8px}#main td.a::before,#main td[colspan]::before{display:none}
#main td[colspan]{display:block;text-align:center}
.cards div{flex:1 1 45%}.bar{justify-content:stretch}.bar>button{flex:1}
input,select,textarea{font-size:16px}button{min-height:38px}
.modal{padding:0;align-items:stretch}.box{border-radius:0;min-height:100%;max-width:none}
}
@media print{body>*:not(#modal){display:none!important}.noprint{display:none!important}#modal{position:static;background:none;display:block!important;padding:0}.box{max-width:none;padding:0}}
</style></head><body>

function showErr(m){var b=document.getElementById('errbar');if(b){b.style.display='block';b.textContent=m}}

</script>

let dirty=false,R={from:new Date().toISOString().slice(0,8)+'01',to:new Date().toISOString().slice(0,10)};
/* ---------- Sincronización con Supabase ---------- */
const st=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.fromEntries(Object.entries(x).sort()):x);
let SNAP=new Map(),chain=Promise.resolve(),USER='';
const save=()=>{chain=chain.then(push).catch(e=>{setStat('⚠ Error al sincronizar');showErr('Error al guardar en la nube: '+(e.message||e))})};
function rowsNow(){const m=new Map();
 ['prods','clients','docs','pays','cash'].forEach(k=>S[k].forEach(x=>m.set(k+'|'+x.id,{kind:k,id:x.id,data:x})));
 m.set('cfg|main',{kind:'cfg',id:'main',data:S.cfg});
 Object.entries(S.open).forEach(([d,v])=>m.set('open|'+d,{kind:'open',id:d,data:{v}}));
 return m}
async function push(){
 const now=rowsNow(),up=[],del={};
 now.forEach((r,key)=>{const s=st(r.data);if(SNAP.get(key)!==s)up.push({kind:r.kind,id:r.id,data:r.data,updated_at:new Date().toISOString(),_s:s,_k:key})});
 SNAP.forEach((s,key)=>{if(!now.has(key)){const p=key.split('|');(del[p[0]]=del[p[0]]||[]).push(p.slice(1).join('|'))}});
 for(let i=0;i<up.length;i+=200){const b=up.slice(i,i+200),r=await sb.from('registros').upsert(b.map(({_s,_k,...x})=>x));if(r.error)throw r.error;b.forEach(x=>SNAP.set(x._k,x._s))}
 for(const k in del){const r=await sb.from('registros').delete().eq('kind',k).in('id',del[k]);if(r.error)throw r.error;del[k].forEach(i=>SNAP.delete(k+'|'+i))}
 setStat()}
function applyRow(k,id,data,del){
 const key=k+'|'+id;
 if(k==='cfg'){if(!del){S.cfg=data;SNAP.set(key,st(data))}return}
 if(k==='open'){if(del){delete S.open[id];SNAP.delete(key)}else{S.open[id]=data.v;SNAP.set(key,st(data))}return}
 const a=S[k];if(!a)return;const i=a.findIndex(x=>x.id===id);
 if(del){if(i>=0)a.splice(i,1);SNAP.delete(key)}else{if(i>=0)a[i]=data;else a.push(data);SNAP.set(key,st(data))}}
async function loadAll(){
 let all=[],from=0;
 for(;;){const r=await sb.from('registros').select('kind,id,data').range(from,from+999);if(r.error)throw r.error;all=all.concat(r.data);if(r.data.length<1000)break;from+=1000}
 S={prods:[],clients:[],docs:[],pays:[],cash:[],open:{},cfg:S.cfg};SNAP=new Map();
 all.forEach(r=>applyRow(r.kind,r.id,r.data,false));
 return all.some(r=>r.kind==='cfg')}
function onRT(p){
 const del=p.eventType==='DELETE',o=del?p.old:p.new,key=o.kind+'|'+o.id;
 if(del)applyRow(o.kind,o.id,null,true);else{if(SNAP.get(key)===st(o.data))return;applyRow(o.kind,o.id,o.data,false)}
 if($('#modal').style.display==='flex')dirty=true;else render()}
async function nextNum(k){const r=await sb.rpc('next_num',{k});if(r.error){alert('No se pudo numerar el comprobante: '+r.error.message);throw r.error}return r.data}
const rnd=n=>Math.round(n*100)/100;
const PMS=['Efectivo','Transferencia','Tarjeta de débito','Tarjeta de crédito','Mercado Pago','Cuenta corriente'],PAYM=PMS.filter(x=>x!=='Cuenta corriente');
let CD=new Date().toISOString().slice(0,10);
function calcP(){const c=+val('f_cost')||0,m=val('f_mg');if(m!=='')$('#f_price').value=rnd(c*(1+m/100))}
function calcM(){const c=+val('f_cost')||0,p=+val('f_price')||0;if(c>0)$('#f_mg').value=rnd((p/c-1)*100)}
function calcPM(){const c=+val('f_cost')||0,m=val('f_mgm');if(m!=='')$('#f_pm').value=rnd(c*(1+m/100))}
function calcMM(){const c=+val('f_cost')||0,p=+val('f_pm')||0;if(c>0&&p>0)$('#f_mgm').value=rnd((p/c-1)*100)}
function recalcMg(){
 const L=S.prods.filter(p=>p.mg>0||p.mgm>0);
 if(!L.length)return alert('Ningún producto tiene margen cargado. Editá un producto y completá el margen %.');
 if(confirm('Se recalculan precios de venta y mayorista de '+L.length+' productos según su margen sobre el costo actual. ¿Confirmar?')){L.forEach(p=>{if(p.mg>0)p.price=rnd(p.cost*(1+p.mg/100));if(p.mgm>0)p.pm=rnd(p.cost*(1+p.mgm/100))});save();render()}
}
const calc=(s,d,r)=>Math.round(s*(1-d/100)*(1+r/100)*100)/100;
const price=(p,cid)=>{const c=S.clients.find(x=>x.id===cid);return c&&c.type==='Mayorista'&&p.pm>0?p.pm:p.price};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const money=n=>(n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS'});
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cname=id=>(S.clients.find(c=>c.id===id)||{}).name||'Consumidor final';
const bal=id=>S.docs.filter(d=>d.type==='V'&&d.cid===id).reduce((a,d)=>a+d.total,0)-S.pays.filter(p=>p.cid===id).reduce((a,p)=>a+p.amt,0);
const num=d=>(d.type==='P'?'P-':'V-')+String(d.num).padStart(4,'0');
const val=id=>$('#'+id).value;

 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

function vDocs(){
 const rows=[...S.docs].reverse().map(d=>`<tr><td onclick="printDoc('${d.id}')" style="cursor:pointer;color:var(--pr);text-decoration:underline">${num(d)}</td><td>${d.date}</td><td>${esc(cname(d.cid))}</td><td>${d.type==='P'?'Presupuesto'+(d.status==='Convertido'?' (pasado a venta)':''):'Venta · '+d.pm}</td><td class="r">${money(d.total)}</td><td class="a"><button onclick="printDoc('${d.id}')">Ver / imprimir</button>${d.type==='P'&&d.status!=='Convertido'?`<button onclick="convert('${d.id}')">Pasar a venta</button>`:''}<button class="x" onclick="delDoc('${d.id}')">Eliminar</button></td></tr>`).join('');
 return `${sbox('Buscar por número, cliente, fecha o tipo...')}<div class="bar"><button class="pr" onclick="docForm('P')">+ Presupuesto</button><button class="pr" onclick="docForm('V')">+ Venta</button></div><div class="wrap"><table><tr><th>Nº<th>Fecha<th>Cliente<th>Tipo<th class="r">Total<th></tr>${rows||'<tr><td colspan="6" class="mu">Todavía no hay comprobantes.</td></tr>'}</table></div>`;

 if(ex)s.value=n;else{s.add(new Option(n,n));s.value=n}}
function listForm(){
 const blk=(k,t)=>`<h4 style="margin:12px 0 6px">${t}</h4><div>${(S.cfg[LST[k]]||[]).map((x,i)=>`<span style="display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:14px;padding:2px 4px 2px 10px;margin:0 6px 6px 0">${esc(x)}<button class="x" style="border:0;padding:0 6px" onclick="delOpt('${k}',${i})">×</button></span>`).join('')||'<span class="mu">Todavía no cargaste ninguno.</span>'}</div><div class="bar" style="justify-content:flex-start"><input id="n_${k}" placeholder="Nuevo..." onkeydown="if(event.key==='Enter')addList('${k}')"><button onclick="addList('${k}')">Agregar</button></div>`;
 modal('<h3>Categorías y proveedores</h3>'+blk('cat','Categorías')+blk('sup','Proveedores')+'<div class="bar" style="margin-top:8px"><button onclick="seedOpts()">Traer los de mis productos</button><button class="pr" onclick="closeM()">Listo</button></div>');
}
function addList(k){const n=val('n_'+k).trim();if(n)pushOpt(k,n);listForm()}
function delOpt(k,i){const key=LST[k];if(confirm('¿Quitar "'+S.cfg[key][i]+'" de la lista? Los productos que ya lo usan lo conservan.')){S.cfg[key].splice(i,1);save();listForm()}}
function seedOpts(){S.prods.forEach(p=>{if(p.cat)pushOpt('cat',p.cat);if(p.sup)pushOpt('sup',p.sup)});listForm()}

/* ---------- Buscador ---------- */
const Q={};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const sbox=ph=>`<div style="margin-bottom:10px"><input id="q" type="search" placeholder="${ph}" value="${esc(Q[tab]||'')}" oninput="filt(this.value)" style="width:100%"><p id="nores" class="mu" style="display:none;margin:8px 0 0">Sin resultados.</p></div>`;
function filt(v){Q[tab]=v;applyQ()}
function applyQ(){
 const q=norm(Q[tab]||'').trim(),ws=q?q.split(/\s+/):[];let n=0,vis=0;
 document.querySelectorAll('#main table').forEach(t=>[...t.rows].forEach(r=>{
  if(r.querySelector('th')||r.querySelector('td[colspan]'))return;
  n++;const tx=norm([...r.cells].filter(c=>!c.classList.contains('a')).map(c=>c.textContent).join(' ')),ok=ws.every(w=>tx.includes(w));
  r.style.display=ok?'':'none';if(ok)vis++}));
 const m=document.getElementById('nores');if(m)m.style.display=(ws.length&&n&&!vis)?'':'none'}

/* ---------- Reportes ---------- */
function vRep(){
 const ds=S.docs.filter(d=>d.type==='V'&&d.date>=R.from&&d.date<=R.to),tot=ds.reduce((a,d)=>a+d.total,0),cost=ds.reduce((a,d)=>a+d.items.reduce((b,i)=>b+i.qty*(i.cost||0),0),0),P={},C={},M={};
 ds.forEach(d=>{const c=cname(d.cid),m=d.date.slice(0,7);C[c]=(C[c]||0)+d.total;M[m]=(M[m]||0)+d.total;d.items.forEach(i=>{const o=P[i.name]||(P[i.name]={q:0,t:0});o.q+=i.qty;o.t+=i.qty*i.price})});
 const tb=(h,r)=>`<div class="wrap" style="margin-bottom:12px"><table><tr>${h}</tr>${r||'<tr><td class="mu">Sin datos en el período.</td></tr>'}</table></div>`;
 const srt=o=>Object.entries(o).sort((a,b)=>(b[1].t??b[1])-(a[1].t??a[1]));
 return `<div class="bar" style="justify-content:flex-start"><label>Desde<input type="date" value="${R.from}" onchange="R.from=this.value;render()"></label><label>Hasta<input type="date" value="${R.to}" onchange="R.to=this.value;render()"></label></div><div class="cards"><div>Ventas<b>${money(tot)}</b></div><div>Cantidad de ventas<b>${ds.length}</b></div><div>Costo<b>${money(cost)}</b></div><div>Ganancia bruta<b class="ok">${money(tot-cost)}</b></div></div>`
 +tb('<th>Producto<th class="r">Unidades<th class="r">Total',srt(P).map(([k,v])=>`<tr><td>${esc(k)}<td class="r">${v.q}<td class="r">${money(v.t)}`).join(''))
 +tb('<th>Cliente<th class="r">Total',srt(C).map(([k,v])=>`<tr><td>${esc(k)}<td class="r">${money(v)}`).join(''))
 +tb('<th>Mes<th class="r">Total',Object.entries(M).sort().map(([k,v])=>`<tr><td>${k}<td class="r">${money(v)}`).join(''));
}

/* ---------- Datos del negocio ---------- */
function cfgForm(){
 const c=S.cfg;
 modal(`<h3>Datos del negocio</h3><div class="g"><label>Nombre<input id="f_n" value="${esc(c.name)}"></label><label>Dirección<input id="f_a" value="${esc(c.addr||'')}"></label><label>Teléfono<input id="f_t" value="${esc(c.tel||'')}"></label><label>CUIT<input id="f_c" value="${esc(c.cuit||'')}"></label><label>Texto al pie del comprobante<input id="f_f" value="${esc(c.foot||'')}"></label><label>Leyenda de los presupuestos<input id="f_q" value="${esc(c.quoteTxt??'Presupuesto sujeto a disponibilidad y variación de precios.')}"></label><label>Cambiar logo<input type="file" accept="image/*" onchange="logoFile(this)"></label></div><div id="lg">${c.logo?`<img src="${c.logo}" style="height:50px">`:''}</div><div class="bar"><button class="x" onclick="S.cfg.logo='';$('#lg').innerHTML=''">Quitar logo</button><button onclick="closeM()">Cancelar</button><button class="pr" onclick="saveCfg()">Guardar</button></div>`);
}
function logoFile(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.cfg.logo=r.result;$('#lg').innerHTML=`<img src="${r.result}" style="height:50px">`};r.readAsDataURL(f)}
function saveCfg(){Object.assign(S.cfg,{name:val('f_n')||S.cfg.name,addr:val('f_a'),tel:val('f_t'),cuit:val('f_c'),foot:val('f_f'),quoteTxt:val('f_q')});save();closeM();render()}

/* ---------- Acceso, respaldo y arranque ---------- */
function fsStat(){}
function setStat(t){const e=$('#fs');if(e)e.textContent=t||'☁ Conectado · '+USER}
function backup(){
 modal(`<h3>Respaldo de datos</h3><p class="mu">Los datos están guardados en la base de datos en la nube y se comparten entre todos los dispositivos. Igual conviene bajar una copia de vez en cuando.</p><div style="display:flex;flex-direction:column;gap:8px"><button class="pr" onclick="exportF()">Exportar copia (descargar archivo)</button><label style="flex-direction:row;align-items:center;gap:8px">Importar copia (reemplaza TODO):<input type="file" accept=".json" onchange="importF(this)"></label></div><div class="bar" style="margin-top:12px"><button onclick="closeM()">Cerrar</button></div>`);
}
function exportF(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='ventas_'+today()+'.json';a.click()}
function importF(i){const f=i.files[0];if(f)f.text().then(load)}
function load(t){try{const o=JSON.parse(t);if(!o.prods||!o.clients||!o.docs||!o.pays||!o.cfg)throw 0;
 if(confirm('ATENCIÓN: esto reemplaza los datos de TODOS los usuarios por los del archivo. ¿Continuar?')){S=Object.assign({cash:[],open:{}},o);save();['P','V'].forEach(k=>sb.rpc('set_num',{k,v:Math.max(0,...S.docs.filter(d=>d.type===k).map(d=>d.num))}));closeM();render()}}
 catch(e){alert('El archivo no es un respaldo válido.')}}
async function login(){
 $('#l_err').textContent='Ingresando…';
 const r=await sb.auth.signInWithPassword({email:val('l_mail').trim(),password:val('l_pw')});
 if(r.error)return $('#l_err').textContent='No se pudo ingresar: '+r.error.message;
 start(r.data.session)}
async function logout(){await sb.auth.signOut();location.reload()}
async function start(s){
 USER=s.user.email;$('#login').style.display='none';setStat('Cargando datos…');
 try{const hasCfg=await Promise.race([loadAll(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('tiempo de espera agotado: revisá tu conexión o si el proyecto de Supabase está pausado')),20000))]);if(!hasCfg)save();
  sb.channel('reg').on('postgres_changes',{event:'*',schema:'public',table:'registros'},onRT).subscribe(status=>{if(status==='SUBSCRIBED')setStat()});
  render()}catch(e){setStat('⚠ No se pudo cargar');showErr('No se pudo cargar los datos: '+(e.message||e))}}
async function boot(){
 if(!sb){$('#l_err').textContent='Falta configurar la URL y la clave de Supabase en el archivo config.js (o no hay conexión a internet).';return}
 const{data}=await sb.auth.getSession();
 if(data.session)start(data.session);
 sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_OUT')$('#login').style.display='flex'})}
function mobileLabels(){document.querySelectorAll('#main table').forEach(t=>{const r0=t.rows[0];if(!r0||!r0.querySelector('th'))return;const hs=[...r0.cells].map(c=>c.textContent);r0.classList.add('hd');[...t.rows].slice(1).forEach(r=>[...r.cells].forEach((c,i)=>c.dataset.l=hs[i]||''))})}
let IP=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;if(window.matchMedia&&matchMedia('(max-width:700px)').matches)$('#inst').style.display=''});
window.addEventListener('appinstalled',()=>{$('#inst').style.display='none';IP=null});
function installApp(){if(IP){IP.prompt();IP=null;$('#inst').style.display='none'}}
boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
